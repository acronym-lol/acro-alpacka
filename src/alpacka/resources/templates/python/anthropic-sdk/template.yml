schema: 1
kind: python
name: anthropic-sdk
description: >-
  Claude API starter — anthropic SDK with prompt caching, adaptive thinking,
  refusal fallbacks, multi-turn conversation, and stop_reason handling.
  Defaults to Claude Opus 5.5; pick Sonnet 5.5 / Haiku 5.5 in variables.
  Loads ANTHROPIC_API_KEY from .env.

substitutions:
  PROJECT_NAME: "{{project:name}}"
  PROJECT_SLUG: "{{project:slug}}"

kind_data:
  python:
    entry: main.py

trees:
  - {src: files, dst: .}

files:
  - {src: files/pyproject.toml, dst: pyproject.toml, substitute: true, overwrite: true}
  - {src: files/README.md, dst: README.md, substitute: true, overwrite: true}

variables:
  - name: ANTHROPIC_MODEL
    type: enum
    prompt: "Claude model"
    default: claude-opus-5-5
    description: "Opus for the hardest work, Sonnet for everyday speed, Haiku for speed and cost."
    options:
      - {value: claude-opus-5-5, label: "Opus 5.5 — most capable; coding + agentic"}
      - {value: claude-sonnet-5-5, label: "Sonnet 5.5 — fast and capable for everyday work"}
      - {value: claude-haiku-5-5, label: "Haiku 5.5 — fastest, lowest cost"}
  - name: EFFORT
    type: enum
    prompt: "Effort level"
    default: medium
    description: "How much Claude thinks before answering, and overall token spend."
    options:
      - {value: low, label: "low — fast + cheap"}
      - {value: medium, label: "medium — balanced (recommended default)"}
      - {value: high, label: "high — slower, more thorough"}
      - {value: xhigh, label: "xhigh — deeper still; good for coding + agentic work"}
      - {value: max, label: "max — most thorough, highest cost"}
  - name: REFERENCE_FILE
    type: string
    default: reference.md
    prompt: "Reference document"
    description: "Loaded into the system prompt and cached. Edit reference.md or change this to point at your own file."
