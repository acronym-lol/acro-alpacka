schema: 1
kind: python
name: anthropic-sdk
description: >-
  Claude API starter — anthropic SDK with prompt caching, adaptive thinking,
  multi-turn conversation, and stop_reason handling. Defaults to Claude Sonnet
  4.6; pick Opus 4.7 / Haiku 4.5 in variables. Loads ANTHROPIC_API_KEY from .env.

substitutions:
  PROJECT_NAME: "{{project:name}}"
  PROJECT_SLUG: "{{project:slug}}"

kind_data:
  python:
    entry: main.py

trees:
  - {src: files, dst: .}

files:
  - {src: files/pyproject.toml, dst: pyproject.toml, substitute: true, overwrite: true}
  - {src: files/README.md, dst: README.md, substitute: true, overwrite: true}

variables:
  - name: ANTHROPIC_MODEL
    type: enum
    prompt: "Claude model"
    default: claude-sonnet-4-6
    description: "Sonnet for balance, Opus for hard problems, Haiku for speed/cost."
    options:
      - {value: claude-sonnet-4-6, label: "Sonnet 4.6 — best speed/intelligence balance"}
      - {value: claude-opus-4-7, label: "Opus 4.7 — most capable; coding + agentic"}
      - {value: claude-haiku-4-5, label: "Haiku 4.5 — fastest, most cost-effective"}
  - name: USE_ADAPTIVE_THINKING
    type: bool
    default: true
    prompt: "Enable adaptive thinking"
    description: "Claude decides depth per request. Adds latency; better answers."
  - name: EFFORT
    type: enum
    prompt: "Effort level"
    default: medium
    description: "Controls thinking depth and overall token spend. `max` is Opus-only."
    options:
      - {value: low, label: "low — fast + cheap"}
      - {value: medium, label: "medium — balanced (recommended default)"}
      - {value: high, label: "high — slower, more thorough"}
      - {value: max, label: "max — Opus-only ceiling"}
  - name: REFERENCE_FILE
    type: string
    default: reference.md
    prompt: "Reference document"
    description: "Loaded into the system prompt and cached. Edit reference.md or change this to point at your own file."
