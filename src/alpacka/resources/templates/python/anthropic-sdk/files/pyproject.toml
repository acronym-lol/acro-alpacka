[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "{{PROJECT_SLUG}}"
version = "0.0.1"
description = "Claude API service."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.92",
    "python-dotenv>=1.0",
]

[tool.setuptools]
py-modules = ["main"]
