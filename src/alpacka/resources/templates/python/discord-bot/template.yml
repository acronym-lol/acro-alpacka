schema: 1
kind: python
name: discord-bot-py
description: >-
  discord.py bot with slash commands organized into cogs. Token from .env,
  /ping and /hello commands, auto-loads cogs from cogs/. Mirror of
  nodejs/discord-bot in Python.

substitutions:
  PROJECT_NAME: "{{project:name}}"
  PROJECT_SLUG: "{{project:slug}}"

kind_data:
  python:
    entry: bot.py

trees:
  - {src: files, dst: .}

files:
  - {src: files/pyproject.toml, dst: pyproject.toml, substitute: true, overwrite: true}
  - {src: files/README.md, dst: README.md, substitute: true, overwrite: true}

variables:
  - name: DISCORD_TOKEN
    type: string
    default: ""
    prompt: "Bot token"
    description: "Move to alpacka.local.yml so it doesn't get committed."
  - name: DISCORD_GUILD_ID
    type: string
    default: ""
    prompt: "Guild ID for dev (optional — leave blank to register globally)"
    description: "Guild commands sync instantly; global commands take ~1h to propagate. Use a guild ID during dev."
