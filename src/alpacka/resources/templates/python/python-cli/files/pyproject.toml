[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "{{PROJECT_SLUG}}"
version = "0.0.1"
description = "A Python CLI."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
{{PROJECT_SLUG}} = "main:app"

[tool.setuptools]
py-modules = ["main"]
