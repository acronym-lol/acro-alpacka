# Mosquitto MQTT broker — dev defaults.
# Anonymous access is fine for local dev; lock it down for anything
# reachable beyond localhost (see README).

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type all

# MQTT over plain TCP
listener 1883
protocol mqtt
allow_anonymous true

# MQTT over WebSocket (for browser clients via mqtt.js)
listener 9001
protocol websockets
allow_anonymous true
