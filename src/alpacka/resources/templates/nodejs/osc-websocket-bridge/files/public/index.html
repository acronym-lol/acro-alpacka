<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OSC ↔ WebSocket bridge</title>
    <style>
      :root {
        color-scheme: dark;
        --fg: #ececec;
        --bg: #0c0c0c;
        --muted: #9d948b;
        --accent: #fdcf00;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 24px;
        background: var(--bg); color: var(--fg);
        font: 14px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif;
      }
      h1 { margin: 0 0 4px; font-size: 20px; }
      .meta { color: var(--muted); margin-bottom: 18px; font-size: 12px; }
      .meta code { color: var(--fg); background: #1f2222; padding: 2px 6px; border-radius: 3px; }
      .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      .pane { background: #141312; border: 1px solid #2b302f; border-radius: 4px; padding: 14px; }
      h2 { margin: 0 0 10px; font-size: 14px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.4px; }
      pre { margin: 0; max-height: 60vh; overflow: auto; font: 12px/1.5 ui-monospace, "Cascadia Mono", monospace; }
      .row { color: var(--muted); }
      .row b { color: var(--fg); margin-right: 8px; }
      form { display: flex; gap: 6px; margin-top: 10px; }
      input { flex: 1; background: #0c0c0c; color: var(--fg); border: 1px solid #2b302f; border-radius: 3px; padding: 6px 8px; font: inherit; }
      button { background: var(--accent); color: #0c0c0c; border: 0; border-radius: 3px; padding: 6px 12px; font-weight: 600; cursor: pointer; }
      .status { margin-top: 18px; color: var(--muted); font-size: 12px; }
      .status .ok { color: #07a400; }
      .status .err { color: #db5400; }
    </style>
  </head>
  <body>
    <h1>OSC ↔ WebSocket bridge</h1>
    <div class="meta">
      Inbound OSC: <code>udp 0.0.0.0:__OSC_IN_PORT__</code> &middot;
      Outbound OSC: <code>__OSC_OUT__</code> &middot;
      WebSocket: <code>ws://localhost:__WS_PORT__</code>
    </div>

    <div class="panes">
      <div class="pane">
        <h2>← OSC in</h2>
        <pre id="incoming"></pre>
      </div>
      <div class="pane">
        <h2>OSC out →</h2>
        <pre id="sent"></pre>
        <form id="send-form">
          <input id="addr" placeholder="/foo" required />
          <input id="args" placeholder="1, 2.0, &quot;hi&quot; (JSON array body)" />
          <button type="submit">Send</button>
        </form>
      </div>
    </div>

    <div class="status" id="status">connecting…</div>

    <script>
      const incoming = document.getElementById("incoming");
      const sent = document.getElementById("sent");
      const status = document.getElementById("status");

      const ws = new WebSocket(`ws://${location.hostname}:__WS_PORT__`);

      ws.onopen = () => {
        status.innerHTML = '<span class="ok">connected</span>';
      };
      ws.onerror = () => {
        status.innerHTML = '<span class="err">error — is the bridge running?</span>';
      };
      ws.onclose = () => {
        status.innerHTML = '<span class="err">disconnected</span>';
      };
      ws.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          const row = document.createElement("div");
          row.className = "row";
          row.innerHTML = `<b>${msg.address}</b> ${JSON.stringify(msg.args ?? [])}`;
          incoming.prepend(row);
        } catch {
          incoming.textContent = ev.data + "\n" + incoming.textContent;
        }
      };

      document.getElementById("send-form").addEventListener("submit", (ev) => {
        ev.preventDefault();
        const address = document.getElementById("addr").value.trim();
        const argsText = document.getElementById("args").value.trim();
        let args = [];
        if (argsText) {
          try {
            args = JSON.parse(`[${argsText}]`);
          } catch {
            alert("Args must be a JSON-array body, e.g.  1, 2.0, \"x\"");
            return;
          }
        }
        ws.send(JSON.stringify({ address, args }));
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `<b>${address}</b> ${JSON.stringify(args)}`;
        sent.prepend(row);
      });
    </script>
  </body>
</html>
