<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Socket.io cue server</title>
    <style>
      :root {
        color-scheme: dark;
        --fg: #ececec;
        --bg: #0c0c0c;
        --muted: #9d948b;
        --accent: #fdcf00;
        --green: #07a400;
        --red: #db5400;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 24px;
        background: var(--bg); color: var(--fg);
        font: 14px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif;
      }
      h1 { margin: 0 0 4px; font-size: 20px; }
      .meta { color: var(--muted); margin-bottom: 18px; font-size: 12px; }
      .meta code { color: var(--fg); background: #1f2222; padding: 2px 6px; border-radius: 3px; }
      .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      .pane { background: #141312; border: 1px solid #2b302f; border-radius: 4px; padding: 14px; }
      h2 { margin: 0 0 10px; font-size: 14px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.4px; }
      pre { margin: 0; max-height: 60vh; overflow: auto; font: 12px/1.5 ui-monospace, "Cascadia Mono", monospace; }
      .row { color: var(--muted); white-space: pre-wrap; }
      .row b { color: var(--fg); margin-right: 8px; }
      form { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
      input { flex: 1; min-width: 100px; background: #0c0c0c; color: var(--fg); border: 1px solid #2b302f; border-radius: 3px; padding: 6px 8px; font: inherit; }
      button { background: var(--accent); color: #0c0c0c; border: 0; border-radius: 3px; padding: 6px 12px; font-weight: 600; cursor: pointer; }
      .status { margin-top: 18px; color: var(--muted); font-size: 12px; }
      .status .ok { color: var(--green); }
      .status .err { color: var(--red); }
    </style>
  </head>
  <body>
    <h1>Socket.io cue server</h1>
    <div class="meta">
      Server: <code>http://localhost:__PORT__</code> &middot;
      REST broadcast: <code>POST /cue</code> &middot;
      Docs: <code>server.js</code>
    </div>

    <div class="panes">
      <div class="pane">
        <h2>← incoming</h2>
        <pre id="incoming"></pre>
      </div>
      <div class="pane">
        <h2>outgoing →</h2>
        <pre id="sent"></pre>
        <form id="send-form">
          <input id="cue-name" placeholder="cue name (e.g. go)" required />
          <input id="cue-data" placeholder='data as JSON (e.g. {"scene":"intro"})' />
          <input id="cue-room" placeholder="room (blank = broadcast)" />
          <button type="submit">Fire cue</button>
        </form>
      </div>
    </div>

    <div class="status" id="status">connecting…</div>

    <script src="https://cdn.socket.io/4.8.0/socket.io.min.js"></script>
    <script>
      const incoming = document.getElementById("incoming");
      const sent = document.getElementById("sent");
      const status = document.getElementById("status");

      const socket = io(`http://${location.hostname}:__PORT__`, { transports: ["websocket", "polling"] });

      function log(el, head, body) {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `<b>${head}</b> ${body}`;
        el.prepend(row);
      }

      socket.on("connect", () => {
        status.innerHTML = `<span class="ok">connected — ${socket.id}</span>`;
      });
      socket.on("connect_error", (err) => {
        status.innerHTML = `<span class="err">error — ${err.message}</span>`;
      });
      socket.on("disconnect", (reason) => {
        status.innerHTML = `<span class="err">disconnected (${reason})</span>`;
      });
      socket.on("welcome", (msg) => log(incoming, "welcome", JSON.stringify(msg)));
      socket.on("peer:join", (msg) => log(incoming, "peer:join", msg.id));
      socket.on("peer:leave", (msg) => log(incoming, "peer:leave", msg.id));
      socket.on("cue", (msg) => log(incoming, `cue '${msg.name}'`, JSON.stringify(msg)));

      document.getElementById("send-form").addEventListener("submit", (ev) => {
        ev.preventDefault();
        const name = document.getElementById("cue-name").value.trim();
        const dataText = document.getElementById("cue-data").value.trim();
        const room = document.getElementById("cue-room").value.trim() || undefined;
        let data = null;
        if (dataText) {
          try { data = JSON.parse(dataText); }
          catch { alert("data must be valid JSON"); return; }
        }
        socket.emit("cue", { name, data, room });
        log(sent, `cue '${name}'`, JSON.stringify({ data, room: room ?? "(broadcast)" }));
      });
    </script>
  </body>
</html>
