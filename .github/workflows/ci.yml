name: CI

# Tests + import smoke on every push and pull request to dev and main.
#
# The unit tests cover the Qt-free modules (project load/save, approval,
# process tracking, td_prefs, installer/template hardening) against temp
# folders. The import smoke instantiates nothing visible — it just imports
# the package and the main UI modules against the offscreen platform
# plugin, so PySide6 / resource wiring can't rot between releases.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Read-only: CI never needs to write to the repo. Pull requests from forks
# get a read-only token anyway; this keeps pushes the same.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Import smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import alpacka; from alpacka import app, db, library, settings, paths, updater; from alpacka.ui import main_window, title_bar, frameless, settings_view; assert updater.compare_versions('0.2.0', '0.1.0') == 1; print('alpacka', alpacka.__version__)"
