name: CI

# Tests + import smoke on every push and pull request to dev and main.
#
# The unit tests cover the Qt-free modules (project load/save, approval,
# process tracking, td_prefs, installer/template hardening) against temp
# folders. The import smoke instantiates nothing visible — it just imports
# the package and the main UI modules against the offscreen platform
# plugin, so PySide6 / resource wiring can't rot between releases.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Read-only: CI never needs to write to the repo. Pull requests from forks
# get a read-only token anyway; this keeps pushes the same.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Import smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import alpacka; from alpacka import app, db, library, settings, paths, updater; from alpacka.ui import main_window, title_bar, frameless, settings_view, update_dialog; assert updater.compare_versions('0.2.0', '0.1.0') == 1; print('alpacka', alpacka.__version__)"

  # release.yml only runs on a tag, so without this job the macOS app is
  # first built on release day and first opened by whoever downloads it.
  # v0.9.0 shipped with a broken signature that way, and macOS called the
  # app "damaged". This job runs the release's build and DMG steps (both
  # check the signature), then checks the built app starts and keeps
  # running.
  build-macos:
    name: Build macOS app
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Build and check the signature
        run: python build.py

      - name: Create the DMG and check the app inside it
        run: |
          brew install create-dmg
          bash installer/make_dmg.sh "$(python -c 'import alpacka; print(alpacka.__version__)')"

      - name: Start the built app
        run: |
          dist/ALPACKA.app/Contents/MacOS/ALPACKA &
          pid=$!
          sleep 20
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
            echo "ALPACKA was still running after 20 s"
          else
            code=0
            wait "$pid" || code=$?
            echo "::error::ALPACKA exited during startup (exit code $code)"
            exit 1
          fi

  # The Windows installer, built the way release.yml builds it, plus the
  # silent update that "Update and restart" runs (installer/test_update.ps1):
  # two installers from one bundle, A then B, checking that B waits for
  # ALPACKA to quit and opens it again. Runs on a clean runner because it
  # installs ALPACKA for the current user.
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Build
        run: python build.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build two installers
        shell: pwsh
        run: |
          $v = python -c "import alpacka; print(alpacka.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$v" installer\alpacka.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $iscc "/DMyAppVersion=$v-ci-update" installer\alpacka.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Test the silent update
        shell: pwsh
        run: |
          ./installer/test_update.ps1 `
            -SetupA "installer\Output\ALPACKA-$env:VERSION-windows-x64-setup.exe" `
            -VersionA $env:VERSION `
            -SetupB "installer\Output\ALPACKA-$env:VERSION-ci-update-windows-x64-setup.exe" `
            -VersionB "$env:VERSION-ci-update"
