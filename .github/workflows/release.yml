name: Release

# Tag-triggered release build for ALPACKA.
#
# Flow:
#   1. Developer bumps __version__ in src/alpacka/__init__.py, commits.
#   2. Developer tags the commit `v<version>` and pushes the tag.
#   3. This workflow runs on windows-latest and macos-latest.
#   4. Each runner checks the tag matches __version__, runs the tests,
#      builds the PyInstaller bundle, packages it in the native format, and
#      attaches the artifact(s) plus a SHA-256 checksum file to the GitHub
#      Release for the tag (created if missing).
#
# Artifacts per release:
#   Windows: ALPACKA-<version>-windows-x64-setup.exe   (Inno Setup, primary)
#            ALPACKA-<version>-windows-x64-portable.zip (portable fallback)
#            SHA256SUMS-windows.txt
#   macOS:   ALPACKA-<version>-macos.dmg                (drag-to-Applications)
#            SHA256SUMS-macos.txt
#
# None of the artifacts are code-signed yet. Users see SmartScreen /
# Gatekeeper on first launch; docs/getting-started.md walks them through
# it. The SHA256SUMS files let them check a download matches what was built.
#
# Third-party actions are pinned to a commit SHA (with the version in a
# comment): this job can write to the repo's releases, so a moved tag must
# not be able to change what runs here.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # softprops/action-gh-release uploads assets + creates the release

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Derive version from tag
        id: version
        shell: bash
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The tag-derived version is passed through `env:` and used as a
      # quoted variable, never pasted into a script.
      - name: Check the tag matches __version__
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.v }}
        run: |
          code_version="$(python -c 'import alpacka; print(alpacka.__version__)')"
          if [ "$VERSION" != "$code_version" ]; then
            echo "::error::Tag v$VERSION doesn't match alpacka.__version__ ($code_version)"
            exit 1
          fi

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build PyInstaller bundle
        run: python build.py

      # --- Windows packaging -----------------------------------------------

      - name: Create portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.v }}
        run: |
          $zipName = "ALPACKA-$env:VERSION-windows-x64-portable.zip"
          Compress-Archive -Path dist\ALPACKA -DestinationPath $zipName -Force
          Write-Host "Wrote $zipName ($((Get-Item $zipName).Length) bytes)"

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.v }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" installer\alpacka.iss
          Get-ChildItem installer\Output

      - name: Checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.v }}
        run: |
          $files = @(
            "ALPACKA-$env:VERSION-windows-x64-portable.zip",
            "installer\Output\ALPACKA-$env:VERSION-windows-x64-setup.exe"
          )
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $f).Hash.ToLower()
            "$hash  $(Split-Path -Leaf $f)"
          }
          $lines | Set-Content -Encoding ascii SHA256SUMS-windows.txt
          Get-Content SHA256SUMS-windows.txt

      # --- macOS packaging -------------------------------------------------

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      # Same script CI runs on every pull request. It also checks the app's
      # signature inside the finished DMG.
      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ steps.version.outputs.v }}
        run: bash installer/make_dmg.sh "$VERSION"

      - name: Checksums (macOS)
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ steps.version.outputs.v }}
        run: |
          shasum -a 256 "ALPACKA-${VERSION}-macos.dmg" > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt

      # --- Release upload ---------------------------------------------------
      # One upload step per platform, so each can insist every file exists.

      - name: Upload release assets (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: |
            ALPACKA-${{ steps.version.outputs.v }}-windows-x64-portable.zip
            installer/Output/ALPACKA-${{ steps.version.outputs.v }}-windows-x64-setup.exe
            SHA256SUMS-windows.txt
          fail_on_unmatched_files: true
          # Only one matrix job generates notes. The action appends generated
          # notes to an existing release's body, so with both jobs on, the
          # second to finish duplicated them.
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Upload release assets (macOS)
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: |
            ALPACKA-${{ steps.version.outputs.v }}-macos.dmg
            SHA256SUMS-macos.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
